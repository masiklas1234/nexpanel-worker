name: Build URL to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_path:
        description: 'Path icon di repo'
        required: true
        type: string
      build_id:
        description: 'Build ID'
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick

      - name: Process Icon
        run: |
          ICON="${{ github.event.inputs.icon_path }}"
          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon tidak ada di path: $ICON"
            ls -la _build_temp/ || echo "_build_temp kosong"
            exit 1
          fi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert "$ICON" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Icon processed OK"

      - name: Inject App Name dan URL
        run: |
          mkdir -p android/app/src/main/res/values
          python3 << 'PYEOF'
          import html
          import os
          app_name = os.environ["APP_NAME"]
          website_url = os.environ["WEBSITE_URL"]
          xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <string name="app_name">' + html.escape(app_name) + '</string>\n'
              '    <string name="website_url">' + html.escape(website_url) + '</string>\n'
              '</resources>\n'
          )
          with open("android/app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(xml)
          print("strings.xml written OK")
          PYEOF
          echo "=== strings.xml content ==="
          cat android/app/src/main/res/values/strings.xml
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}

      - name: Fix local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      - name: Enable minify + shrink (perkecil ukuran APK)
        run: |
          BGRADLE="android/app/build.gradle"
          # Aktifkan minifyEnabled true
          sed -i "s/minifyEnabled false/minifyEnabled true/" "$BGRADLE" || true
          # Aktifkan shrinkResources true (hapus resource tidak terpakai)
          sed -i "s/shrinkResources false/shrinkResources true/" "$BGRADLE" || true
          # Tambah shrinkResources kalau belum ada sama sekali
          if ! grep -q "shrinkResources" "$BGRADLE"; then
            sed -i "/minifyEnabled/a\            shrinkResources true" "$BGRADLE" || true
          fi
          echo "=== build.gradle release block ==="
          grep -A5 "release {" "$BGRADLE" || true

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Sign APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan setelah build!"
            find android/app/build -name "*.apk" 2>/dev/null || echo "Tidak ada APK"
            exit 1
          fi
          echo "APK ditemukan: $APK"
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=KenzMD,O=BuilderBot,C=MY" -noprompt
          if [ ! -f sign.keystore ]; then
            echo "ERROR: sign.keystore gagal dibuat!"
            exit 1
          fi
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
          $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
            --ks-pass pass:android123 --key-pass pass:android123 \
            --out "${SAFE}_signed.apk" "$APK"
          if [ ! -f "${SAFE}_signed.apk" ]; then
            echo "ERROR: Signing gagal — APK hasil sign tidak ditemukan!"
            exit 1
          fi
          # zipalign — optimasi alignment APK (wajib sebelum publish, juga perkecil ukuran)
          ZIPALIGN=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/zipalign
          $ZIPALIGN -v -p 4 "${SAFE}_signed.apk" "${SAFE}.apk"
          rm -f "${SAFE}_signed.apk"
          $BTOOL verify "${SAFE}.apk" && echo "✅ Signature verified OK"
          echo "APK_FILE=${SAFE}.apk" >> $GITHUB_ENV
          echo "Sign+Align OK: ${SAFE}.apk ($(du -sh ${SAFE}.apk | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: ${{ env.APK_FILE }}
          retention-days: 3