name: Build URL to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_path:
        description: 'Path icon di repo'
        required: true
        type: string
      build_id:
        description: 'Build ID'
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick

      - name: Process Icon
        run: |
          ICON="${{ github.event.inputs.icon_path }}"
          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon tidak ada: $ICON"
            ls _build_temp/ || true
            exit 1
          fi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert "$ICON" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Icon OK"

      - name: Inject App Name dan URL
        run: |
          mkdir -p android/app/src/main/res/values
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEBSITE_URL="${{ github.event.inputs.website_url }}"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">%s</string>\n    <string name="website_url">%s</string>\n</resources>\n' "$APP_NAME" "$WEBSITE_URL" > android/app/src/main/res/values/strings.xml
          echo "strings.xml OK:"
          cat android/app/src/main/res/values/strings.xml

      - name: Fix local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -s "$JAR" ]; then
            curl -fsSL -o "$JAR" "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" || \
            curl -fsSL -o "$JAR" "https://services.gradle.org/distributions/gradle-8.4-bin.zip" --output /dev/null
          fi
          chmod +x android/gradlew
          ls -lh android/gradle/wrapper/

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g

      - name: Sign APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK tidak ada! List outputs:"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "APK ditemukan: $APK"
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=KenzMD,O=BuilderBot,C=MY" -noprompt 2>/dev/null || true
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
          $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
            --ks-pass pass:android123 --key-pass pass:android123 \
            --out "${SAFE}.apk" "$APK"
          echo "APK_FILE=${SAFE}.apk" >> $GITHUB_ENV
          ls -lh "${SAFE}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: ${{ env.APK_FILE }}
          retention-days: 3
          if-no-files-found: error