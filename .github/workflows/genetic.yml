name: Build Genetic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify genetic source
        run: |
          echo "=== Root files ==="
          ls -la
          if [ ! -d "genetic" ]; then
            echo "ERROR: folder genetic/ tidak ditemukan di root repo!"
            exit 1
          fi
          echo "=== genetic/ ==="
          ls -la genetic/
          if [ ! -d "genetic/android" ]; then
            echo "ERROR: genetic/android/ tidak ditemukan!"
            exit 1
          fi
          echo "Genetic source OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Setup Gradle Wrapper
        run: |
          curl -L -o genetic/android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x genetic/android/gradlew

      - name: Generate App Icons
        working-directory: genetic
        run: |
          if [ -f "generate_icons.py" ]; then
            python3 generate_icons.py
            echo "Icons generated"
          else
            echo "generate_icons.py tidak ada — skip icon generation"
          fi

      - name: Fix local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > genetic/android/local.properties
          cat genetic/android/local.properties

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Release APK
        working-directory: genetic/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign + Zipalign + Collect APK
        run: |
          mkdir -p output
          APK=$(find genetic/android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find genetic/android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK ditemukan: $APK ($(du -sh $APK | cut -f1))"
          # Generate keystore
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Genetic,O=BuilderBot,C=MY" -noprompt
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          ZIPALIGN=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/zipalign
          # Sign APK
          $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
            --ks-pass pass:android123 --key-pass pass:android123 \
            --out output/Genetic_signed.apk "$APK"
          # Zipalign (optimasi + perkecil ukuran)
          $ZIPALIGN -v -p 4 output/Genetic_signed.apk output/Genetic.apk
          rm -f output/Genetic_signed.apk
          $BTOOL verify output/Genetic.apk && echo "✅ Signature verified OK"
          echo "Final APK: $(du -sh output/Genetic.apk | cut -f1)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-apk
          path: output/Genetic.apk
          retention-days: 3