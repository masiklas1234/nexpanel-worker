name: Build Genetic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify genetic source
        run: |
          echo "=== Root files ==="
          ls -la
          echo ""
          if [ ! -d "genetic" ]; then
            echo "ERROR: folder genetic/ tidak ditemukan di root repo!"
            exit 1
          fi
          echo "=== genetic/ ==="
          ls -la genetic/
          echo ""
          if [ ! -d "genetic/android" ]; then
            echo "ERROR: genetic/android/ tidak ditemukan!"
            echo "Isi genetic/:"
            ls -la genetic/
            exit 1
          fi
          echo "=== genetic/android/ ==="
          ls -la genetic/android/
          echo "✅ Genetic source OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        working-directory: genetic
        run: |
          if [ -f "generate_icons.py" ]; then
            echo "✅ Menjalankan generate_icons.py"
            python3 generate_icons.py
          else
            echo "⚠️ generate_icons.py tidak ada — skip icon generation"
          fi

      - name: Download Gradle Wrapper JAR
        run: |
          WRAPPER_DIR="genetic/android/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"
          # Coba 3 sumber berbeda agar tidak fail karena GitHub rate-limit
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$WRAPPER_DIR/gradle-wrapper.jar" \
            "https://services.gradle.org/distributions/gradle-8.4-wrapper.jar" \
          || curl -fsSL --retry 3 --retry-delay 5 \
            -o "$WRAPPER_DIR/gradle-wrapper.jar" \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
          || curl -fsSL --retry 3 --retry-delay 5 \
            -o "$WRAPPER_DIR/gradle-wrapper.jar" \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          ls -lh "$WRAPPER_DIR/gradle-wrapper.jar"
          chmod +x genetic/android/gradlew
          echo "✅ Gradle wrapper OK"

      - name: Fix local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > genetic/android/local.properties
          cat genetic/android/local.properties
          echo "✅ local.properties OK"

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Generate Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "✅ debug.keystore dibuat"
          else
            echo "✅ debug.keystore sudah ada"
          fi
          echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: genetic/android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          echo "✅ Build dari: $(pwd)"
          echo "✅ Keystore: $KEYSTORE_PATH"
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Rename & collect APK
        run: |
          mkdir -p output
          APK=$(find genetic/android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find genetic/android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          cp "$APK" output/Genetic.apk
          echo "✅ APK OK: $(du -sh output/Genetic.apk | cut -f1)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-apk
          path: output/Genetic.apk
          retention-days: 3