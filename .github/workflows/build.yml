name: Build NexPanel Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify project files
        run: |
          ls -la src/ || { echo "ERROR: src/ tidak ada"; exit 1; }
          ls src/pubspec.yaml || { echo "ERROR: pubspec.yaml tidak ada"; exit 1; }
          echo "Project files OK"

      - name: Copy source to project root
        run: |
          rm -rf android
          cp -rf src/. .
          echo "=== Files ==="
          ls -la
          echo "=== android/ setelah copy ==="
          ls -la android/ || echo "ERROR: android/ tidak ada setelah copy"

      - name: Patch FakeCallService (fix EXTRA_RINGTONE_URL)
        run: |
          FAKECALL=$(find . -path "*/nex/panel/FakeCallService.java" 2>/dev/null | head -1)
          if [ -z "$FAKECALL" ]; then
            FAKECALL=$(find . -name "FakeCallService.java" 2>/dev/null | head -1)
          fi
          if [ -n "$FAKECALL" ]; then
            echo "FakeCallService ditemukan: $FAKECALL"
            if ! grep -q "EXTRA_RINGTONE_URL" "$FAKECALL"; then
              echo "⚠️  EXTRA_RINGTONE_URL tidak ada — inject konstanta sekarang..."
              # Sisipkan setelah baris pertama yang ada "public class FakeCallService"
              sed -i "/public class FakeCallService/a\    public static final String EXTRA_RINGTONE_URL = \"extra_ringtone_url\";" "$FAKECALL"
              echo "✅ EXTRA_RINGTONE_URL berhasil di-inject ke FakeCallService.java"
            else
              echo "✅ EXTRA_RINGTONE_URL sudah ada — tidak perlu patch"
            fi
            grep -n "EXTRA_RINGTONE_URL" "$FAKECALL" || true
          else
            echo "ℹ️  FakeCallService.java tidak ditemukan — skip patch"
          fi

      - name: Pre-compile Java scan (cek simbol hilang)
        run: |
          echo "=== Scan Java files untuk pattern error umum ==="
          # Cek semua referensi EXTRA_ yang mungkin hilang di service files
          SERVICES=$(find . -name "*Service.java" 2>/dev/null)
          for SVC in $SERVICES; do
            REFS=$(grep -oP "EXTRA_[A-Z_]+" "$SVC" 2>/dev/null | sort -u)
            for REF in $REFS; do
              if ! grep -q "static final String $REF" "$SVC" 2>/dev/null; then
                echo "⚠️  $SVC: $REF tidak didefinisikan di file ini (mungkin di class lain — OK)"
              fi
            done
          done
          echo "Pre-compile scan selesai"

      - name: Fix local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed "s|/bin/flutter||")
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_PATH" >> android/local.properties
          cat android/local.properties

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Compress video asset (kecilkan APK tanpa affect fungsi)
        run: |
          SRC="android/app/src/main/assets/overlay_video.mp4"
          if [ -f "$SRC" ]; then
            sudo apt-get install -y ffmpeg -qq 2>/dev/null || true
            if command -v ffmpeg &>/dev/null; then
              ORIG=$(du -sh "$SRC" | cut -f1)
              ffmpeg -i "$SRC" -vcodec libx264 -crf 28 -preset fast \
                -acodec aac -b:a 64k -y /tmp/vid.mp4 2>/dev/null && \
              [ -s /tmp/vid.mp4 ] && cp /tmp/vid.mp4 "$SRC"
              echo "Video: $ORIG → $(du -sh $SRC | cut -f1)"
            fi
          fi

      - name: Enable minify dan shrink (kecilkan APK)
        run: |
          sed -i "s/minifyEnabled false/minifyEnabled true/" android/app/build.gradle || true
          sed -i "s/shrinkResources false/shrinkResources true/" android/app/build.gradle || true
          grep -E "minify|shrink" android/app/build.gradle || echo "OK"

      - name: Build Flutter APK split-per-abi
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug_info \
            --tree-shake-icons
          echo "=== APK ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexpanel123 -keypass nexpanel123 \
            -dname "CN=NexPanel,O=TanzAI,C=MY" -noprompt
          if [ ! -f sign.keystore ]; then
            echo "ERROR: sign.keystore gagal dibuat!"
            exit 1
          fi
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          mkdir -p signed_apks
          APK_LIST=$(find build/app/outputs -name "*.apk")
          if [ -z "$APK_LIST" ]; then
            echo "ERROR: Tidak ada APK hasil build ditemukan di build/app/outputs!"
            find build/app/outputs -type f 2>/dev/null || echo "Folder outputs tidak ada"
            exit 1
          fi
          for APK in $APK_LIST; do
            ABI=$(echo "$APK" | grep -oP "(arm64-v8a|armeabi-v7a|x86_64)" || echo "universal")
            OUT="signed_apks/NexPanel_${ABI}.apk"
            $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
              --ks-pass pass:nexpanel123 --key-pass pass:nexpanel123 \
              --out "$OUT" "$APK"
            $BTOOL verify "$OUT" && echo "✅ Signed & verified: $OUT ($(du -sh $OUT | cut -f1))"
          done
          if [ -z "$(ls -A signed_apks/ 2>/dev/null)" ]; then
            echo "ERROR: Tidak ada APK ter-sign di signed_apks/!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexpanel-apk
          path: signed_apks/*.apk
          retention-days: 3