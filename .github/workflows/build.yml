name: Build NexPanel Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify project files
        run: |
          ls -la src/ || { echo "ERROR: src/ tidak ada"; exit 1; }
          ls src/pubspec.yaml || { echo "ERROR: pubspec.yaml tidak ada"; exit 1; }
          echo "Project files OK"

      - name: Copy source to project root
        run: |
          # FIX: Bersihkan android/ root dulu (mungkin sisa project WebView /buildurl)
          # agar tidak tercampur dengan android/ milik project Flutter user
          rm -rf android
          cp -rf src/. .
          echo "=== Files ==="
          ls -la
          echo "=== android/ setelah copy ==="
          ls -la android/ || echo "ERROR: android/ tidak ada setelah copy — project Flutter tidak punya folder android/"

      - name: Fix local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed "s|/bin/flutter||")
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_PATH" >> android/local.properties
          cat android/local.properties

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Compress video asset (kecilkan APK tanpa affect fungsi)
        run: |
          SRC="android/app/src/main/assets/overlay_video.mp4"
          if [ -f "$SRC" ]; then
            sudo apt-get install -y ffmpeg -qq 2>/dev/null || true
            if command -v ffmpeg &>/dev/null; then
              ORIG=$(du -sh "$SRC" | cut -f1)
              ffmpeg -i "$SRC" -vcodec libx264 -crf 28 -preset fast \
                -acodec aac -b:a 64k -y /tmp/vid.mp4 2>/dev/null && \
              [ -s /tmp/vid.mp4 ] && cp /tmp/vid.mp4 "$SRC"
              echo "Video: $ORIG → $(du -sh $SRC | cut -f1)"
            fi
          fi

      - name: Enable minify dan shrink (kecilkan APK)
        run: |
          python3 << 'PYEOF'
          import os, re
          candidates = ["android/app/build.gradle", "android/app/build.gradle.kts"]
          target = next((p for p in candidates if os.path.isfile(p)), None)
          if not target:
              print("⚠️  build.gradle(.kts) tidak ditemukan — skip")
          else:
              with open(target, "r", encoding="utf-8") as f:
                  content = f.read()
              is_kts = target.endswith(".kts")
              if is_kts:
                  content2 = re.sub(r"isMinifyEnabled\s*=\s*false", "isMinifyEnabled = true", content)
                  content2 = re.sub(r"isShrinkResources\s*=\s*false", "isShrinkResources = true", content2)
                  has_true = re.search(r"isMinifyEnabled\s*=\s*true", content2)
              else:
                  content2 = re.sub(r"minifyEnabled\s+false", "minifyEnabled true", content)
                  content2 = re.sub(r"shrinkResources\s+false", "shrinkResources true", content2)
                  has_true = re.search(r"minifyEnabled\s+true", content2)
              if not has_true:
                  if is_kts:
                      override = (
                          "\nandroid {\n    buildTypes {\n        getByName(\"release\") {\n"
                          "            isMinifyEnabled = true\n            isShrinkResources = true\n"
                          "        }\n    }\n}\n"
                      )
                  else:
                      override = (
                          "\nandroid {\n    buildTypes {\n        release {\n"
                          "            minifyEnabled true\n            shrinkResources true\n"
                          "        }\n    }\n}\n"
                      )
                  content2 += override
                  print(f"ℹ️  Pattern minify tidak ditemukan di {target} — override block ditambahkan")
              with open(target, "w", encoding="utf-8") as f:
                  f.write(content2)
              print(f"✅ {target} — minify+shrink dipaksa aktif")
          PYEOF

      - name: Build Flutter APK split-per-abi
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug_info \
            --tree-shake-icons
          echo "=== APK ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexpanel123 -keypass nexpanel123 \
            -dname "CN=NexPanel,O=TanzAI,C=MY" -noprompt
          if [ ! -f sign.keystore ]; then
            echo "ERROR: sign.keystore gagal dibuat!"
            exit 1
          fi
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          mkdir -p signed_apks
          APK_LIST=$(find build/app/outputs -name "*.apk")
          if [ -z "$APK_LIST" ]; then
            echo "ERROR: Tidak ada APK hasil build ditemukan di build/app/outputs!"
            find build/app/outputs -type f 2>/dev/null || echo "Folder outputs tidak ada"
            exit 1
          fi
          for APK in $APK_LIST; do
            ABI=$(echo "$APK" | grep -oP "(arm64-v8a|armeabi-v7a|x86_64)" || echo "universal")
            OUT="signed_apks/NexPanel_${ABI}.apk"
            $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
              --ks-pass pass:nexpanel123 --key-pass pass:nexpanel123 \
              --out "$OUT" "$APK"
            $BTOOL verify "$OUT" && echo "✅ Signed & verified: $OUT ($(du -sh $OUT | cut -f1))"
          done
          if [ -z "$(ls -A signed_apks/ 2>/dev/null)" ]; then
            echo "ERROR: Tidak ada APK ter-sign di signed_apks/!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexpanel-apk
          path: signed_apks/*.apk
          retention-days: 3