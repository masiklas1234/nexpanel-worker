name: Build NexPanel Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install required Android SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" 2>/dev/null || true
          echo "SDK components installed"

      - name: Verify project files
        run: |
          ls -la src/ || { echo "ERROR: src/ tidak ada"; exit 1; }
          test -f src/pubspec.yaml || { echo "ERROR: pubspec.yaml tidak ada"; exit 1; }
          test -f src/android/app/build.gradle || { echo "ERROR: build.gradle tidak ada"; exit 1; }
          echo "Project files OK"

      - name: Copy source to project root
        run: |
          rm -rf android ios linux macos windows web
          cp -rf src/. .
          ls -la
          test -d android || { echo "ERROR: android/ tidak ada"; exit 1; }
          echo "=== build.gradle ==="
          cat android/app/build.gradle

      - name: Fix local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed "s|/bin/flutter||")
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_PATH" >> android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> android/local.properties
          cat android/local.properties

      - name: Setup Gradle JVM args
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "android.enableR8.fullMode=false" >> android/gradle.properties
          cat android/gradle.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter APK split-per-abi
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --tree-shake-icons \
            --verbose 2>&1 | tail -100
          echo "=== APK hasil build ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Sign APK
        run: |
          # FIX 1: Cek APK dulu sebelum generate keystore
          APK_LIST=$(find build/app/outputs -name "*.apk" 2>/dev/null)
          if [ -z "$APK_LIST" ]; then
            echo "ERROR: Tidak ada APK hasil build!"
            find build/ -type f 2>/dev/null || true
            exit 1
          fi
          echo "=== APK ditemukan ==="
          echo "$APK_LIST"
          # FIX 2: Generate keystore
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexpanel123 -keypass nexpanel123 \
            -dname "CN=NexPanel,O=TanzAI,C=MY" -noprompt
          # FIX 3: Cari apksigner pakai find (robust, tidak bergantung ls|sort)
          BTOOL=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$BTOOL" ]; then echo "ERROR: apksigner tidak ditemukan!"; exit 1; fi
          echo "apksigner path: $BTOOL"
          mkdir -p signed_apks
          for APK in $APK_LIST; do
            # FIX 4: grep -oE bukan -oP (kompatibel semua runner ubuntu)
            ABI=$(echo "$APK" | grep -oE "(arm64-v8a|armeabi-v7a|x86_64)" || echo "universal")
            OUT="signed_apks/NexPanel_${ABI}.apk"
            "$BTOOL" sign \
              --ks sign.keystore --ks-key-alias key0 \
              --ks-pass pass:nexpanel123 --key-pass pass:nexpanel123 \
              --out "$OUT" "$APK"
            echo "Signed: $OUT ($(du -sh "$OUT" | cut -f1))"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexpanel-apk
          path: signed_apks/*.apk
          retention-days: 3