name: Build NexPanel Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Copy source to flutter project root
        run: |
          cp -r src/. .
          echo "=== Project files ==="
          ls -la

      - name: Fix local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed s/\/bin\/flutter//)" >> android/local.properties
          cat android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Compress video asset (jimat ~60% tanpa affect fungsi)
        run: |
          SRC="android/app/src/main/assets/overlay_video.mp4"
          if [ -f "$SRC" ]; then
            ORIG=$(du -sh "$SRC" | cut -f1)
            sudo apt-get install -y ffmpeg -qq 2>/dev/null || true
            if command -v ffmpeg &>/dev/null; then
              ffmpeg -i "$SRC" -vcodec libx264 -crf 28 -preset fast \
                -acodec aac -b:a 64k -y /tmp/video_compressed.mp4 2>/dev/null
              if [ -s /tmp/video_compressed.mp4 ]; then
                cp /tmp/video_compressed.mp4 "$SRC"
                NEW=$(du -sh "$SRC" | cut -f1)
                echo "✅ Video compressed: $ORIG → $NEW"
              fi
            else
              echo "ffmpeg tidak ada — skip compress video"
            fi
          fi

      - name: Compress PNG icons (jimat ruang tanpa affect visual)
        run: |
          sudo apt-get install -y optipng -qq 2>/dev/null || true
          if command -v optipng &>/dev/null; then
            find android/app/src/main/res -name "*.png" -exec optipng -o5 -quiet {} \;
            echo "✅ Icons compressed"
          else
            echo "optipng tidak ada — skip"
          fi

      - name: Enable minify + shrink resources di build.gradle
        run: |
          # Hanya aktifkan minify/shrink — TIDAK ubah code atau fungsionaliti
          sed -i "s/minifyEnabled false/minifyEnabled true/" android/app/build.gradle || true
          sed -i "s/shrinkResources false/shrinkResources true/" android/app/build.gradle || true
          echo "✅ build.gradle:"
          grep -E "minify|shrink" android/app/build.gradle || echo "(sudah enabled)"

      - name: Build Flutter APK split-per-abi
        run: |
          # split-per-abi = tiap ABI jadi APK sendiri → jauh lebih kecil
          # tree-shake-icons = buang icon Material yang tidak dipakai
          # obfuscate = compress nama Dart code
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug_info \
            --tree-shake-icons
          echo ""
          echo "=== APK output ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Sign APK
        run: |
          # Generate keystore
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexpanel123 -keypass nexpanel123 \
            -dname "CN=NexPanel,O=TanzAI,C=MY" -noprompt 2>/dev/null || true
          # Sign semua APK
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          mkdir -p signed_apks
          for APK in $(find build/app/outputs -name "*.apk"); do
            BASENAME=$(basename "$APK" .apk)
            OUTFILE="signed_apks/NexPanel_${BASENAME}.apk"
            $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
              --ks-pass pass:nexpanel123 --key-pass pass:nexpanel123 \
              --out "$OUTFILE" "$APK"
            echo "Signed: $OUTFILE ($(du -sh $OUTFILE | cut -f1))"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexpanel-apk
          path: signed_apks/*.apk
          retention-days: 3