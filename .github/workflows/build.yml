name: Build Flutter APK — TANZ AI x Prof. KenzMD\n\non:\n  workflow_dispatch:\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Java 17\n        uses: actions/setup-java@v4\n        with:\n          java-version: '17'\n          distribution: 'temurin'\n\n      - name: Setup Flutter (latest stable — support Dart >=3.9)\n        uses: subosito/flutter-action@v2\n        with:\n          flutter-version: '3.32.4'\n          channel: 'stable'\n          cache: true\n\n      - name: Verify Flutter Version\n        run: |\n          flutter --version\n          dart --version\n          echo "Flutter & Dart OK"\n\n      - name: Verify project files\n        run: |\n          ls -la src/ || { echo "ERROR: src/ tidak ada"; exit 1; }\n          ls src/pubspec.yaml || { echo "ERROR: pubspec.yaml tidak ada"; exit 1; }\n          echo "=== pubspec.yaml ===" && cat src/pubspec.yaml | head -20\n          echo "Project files OK"\n\n      - name: Copy source to project root\n        run: |\n          # Bersihkan sisa project lama agar tidak tercampur\n          rm -rf android ios lib assets fonts web\n          cp -rf src/. .\n          echo "=== Root files ==="\n          ls -la\n          echo "=== android/ ==="\n          ls -la android/ || { echo "ERROR: android/ tidak ada!"; exit 1; }\n          echo "=== lib/ ==="\n          ls -la lib/ || { echo "ERROR: lib/ tidak ada!"; exit 1; }\n\n      - name: Fix local.properties (override macOS/Windows path)\n        run: |\n          FLUTTER_PATH=$(which flutter | sed "s|/bin/flutter||")\n          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties\n          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties\n          echo "flutter.buildMode=release" >> android/local.properties\n          echo "flutter.versionName=2.0.0" >> android/local.properties\n          echo "flutter.versionCode=1" >> android/local.properties\n          echo "=== local.properties ===" && cat android/local.properties\n\n      - name: Accept Android Licenses\n        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true\n\n      - name: Verify fonts folder\n        run: |\n          # Pastikan folder fonts ada (Orbitron & ShareTechMono)\n          if [ -d "fonts" ]; then\n            echo "=== fonts/ ===" && ls -la fonts/\n          else\n            echo "WARNING: fonts/ folder tidak ditemukan — buat placeholder"\n            mkdir -p fonts\n            # Jika font hilang, hapus font declaration dari pubspec agar tidak error\n            sed -i "/^  fonts:/,/^  [^ ]/{ /^  fonts:/d; /family: Orbitron/d; /asset: fonts\/Orbitron/d; /family: ShareTechMono/d; /asset: fonts\/ShareTechMono/d }" pubspec.yaml || true\n          fi\n\n      - name: Verify assets folder\n        run: |\n          echo "=== assets/ ===" && find assets -type f 2>/dev/null | head -20 || echo "No assets"\n          # Compress video assets untuk kecilkan ukuran APK\n          for VID in assets/videos/*.mp4; do\n            if [ -f "$VID" ]; then\n              which ffmpeg &>/dev/null || (sudo apt-get install -y ffmpeg -qq 2>/dev/null || true)\n              if command -v ffmpeg &>/dev/null; then\n                ORIG=$(du -sh "$VID" | cut -f1)\n                ffmpeg -i "$VID" -vcodec libx264 -crf 32 -preset ultrafast \\n                  -acodec aac -b:a 64k -vf scale=-2:720 -y /tmp/vid_out.mp4 2>/dev/null && \\n                [ -s /tmp/vid_out.mp4 ] && [ $(stat -c%s /tmp/vid_out.mp4) -lt $(stat -c%s "$VID") ] && cp /tmp/vid_out.mp4 "$VID"\n                echo "Video $VID: $ORIG → $(du -sh $VID | cut -f1)"\n              fi\n            fi\n          done\n\n      - name: Flutter pub get\n        run: |\n          flutter pub get\n          echo "pub get OK"\n\n      - name: Enable R8 minify untuk APK lebih kecil (build.gradle.kts)\n        run: |\n          # Project ini pakai build.gradle.kts (Kotlin DSL) bukan build.gradle (Groovy)\n          # Tambahkan buildTypes dengan minify ke android/app/build.gradle.kts\n          GRADLE_KTS="android/app/build.gradle.kts"\n          if [ -f "$GRADLE_KTS" ]; then\n            # Cek apakah minify sudah ada\n            if ! grep -q "isMinifyEnabled" "$GRADLE_KTS"; then\n              # Inject shrinkResources dan minifyEnabled ke buildTypes release\n              sed -i "/release {/a\            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")" "$GRADLE_KTS" || true\n            fi\n            echo "=== build.gradle.kts buildTypes ===" && grep -A6 "release {" "$GRADLE_KTS" || true\n          fi\n          # Buat proguard-rules.pro jika belum ada\n          if [ ! -f "android/app/proguard-rules.pro" ]; then\n            cat > android/app/proguard-rules.pro << PROGUARD\n          -keep class io.flutter.** { *; }\n          -keep class com.google.firebase.** { *; }\n          -keep class com.dark.nevox.** { *; }\n          -dontwarn io.flutter.**\n          -dontwarn com.google.**\n          PROGUARD\n          fi\n\n      - name: Build Flutter APK split-per-abi (release)\n        run: |\n          flutter build apk \\n            --release \\n            --split-per-abi \\n            --obfuscate \\n            --split-debug-info=build/debug_info \\n            --tree-shake-icons\n          echo "=== APK Results ==="\n          find build/app/outputs -name "*.apk" -exec ls -lh {} \;\n\n      - name: Sign APK\n        run: |\n          keytool -genkey -v -keystore sign.keystore -alias key0 \\n            -keyalg RSA -keysize 2048 -validity 10000 \\n            -storepass nexpanel123 -keypass nexpanel123 \\n            -dname "CN=LuNEX,O=TanzAI,C=MY" -noprompt\n          if [ ! -f sign.keystore ]; then\n            echo "ERROR: sign.keystore gagal dibuat!"\n            exit 1\n          fi\n          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner\n          mkdir -p signed_apks\n          APK_LIST=$(find build/app/outputs -name "*.apk" | grep -v unsigned || true)\n          if [ -z "$APK_LIST" ]; then\n            APK_LIST=$(find build/app/outputs -name "*.apk")\n          fi\n          if [ -z "$APK_LIST" ]; then\n            echo "ERROR: Tidak ada APK hasil build!"\n            find build/app/outputs -type f 2>/dev/null || echo "Folder outputs kosong"\n            exit 1\n          fi\n          for APK in $APK_LIST; do\n            ABI=$(echo "$APK" | grep -oP "(arm64-v8a|armeabi-v7a|x86_64)" || echo "universal")\n            OUT="signed_apks/LuNEX_${ABI}.apk"\n            $BTOOL sign --ks sign.keystore --ks-key-alias key0 \\n              --ks-pass pass:nexpanel123 --key-pass pass:nexpanel123 \\n              --out "$OUT" "$APK"\n            $BTOOL verify "$OUT" && echo "✅ Signed: $OUT ($(du -sh $OUT | cut -f1))"\n          done\n          if [ -z "$(ls -A signed_apks/ 2>/dev/null)" ]; then\n            echo "ERROR: Tidak ada APK ter-sign!"\n            exit 1\n          fi\n          echo "=== Final APKs ==="\n          ls -lh signed_apks/\n\n      - name: Upload APK Artifacts\n        uses: actions/upload-artifact@v4\n        with:\n          name: nexpanel-apk\n          path: signed_apks/*.apk\n          retention-days: 3