name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        working-directory: ${{ github.workspace }}
        run: python3 generate_icons.py

      - name: Setup Gradle Wrapper JAR
        run: |
          set -e
          WRAPPER_DIR="${{ github.workspace }}/android/gradle/wrapper"
          mkdir -p "$WRAPPER_DIR"

          # Metode 1: cari di sistem (ubuntu-latest sudah ada gradle)
          SYS_JAR=$(find /usr/share/gradle* /opt/gradle* 2>/dev/null \
            -name "gradle-wrapper.jar" 2>/dev/null | head -1)
          if [ -n "$SYS_JAR" ] && [ -f "$SYS_JAR" ]; then
            echo "[OK] Pakai jar dari sistem: $SYS_JAR"
            cp "$SYS_JAR" "$WRAPPER_DIR/gradle-wrapper.jar"

          # Metode 2: download via gradle wrapper task
          else
            echo "[INFO] Coba generate via gradle wrapper task..."
            mkdir -p /tmp/tmpwrapper
            cd /tmp/tmpwrapper
            cat > build.gradle << 'GRADLE'
          wrapper {
            gradleVersion = '8.4'
            distributionType = Wrapper.DistributionType.BIN
          }
          GRADLE
            gradle wrapper 2>/dev/null || true
            GEN_JAR="/tmp/tmpwrapper/gradle/wrapper/gradle-wrapper.jar"
            if [ -f "$GEN_JAR" ]; then
              echo "[OK] Generate berhasil"
              cp "$GEN_JAR" "$WRAPPER_DIR/gradle-wrapper.jar"
            else
              # Metode 3: download langsung dari services.gradle.org
              echo "[INFO] Coba download dari services.gradle.org..."
              curl -fsSL \
                "https://services.gradle.org/distributions/gradle-8.4-wrapper.jar" \
                -o "$WRAPPER_DIR/gradle-wrapper.jar" 2>/dev/null || true

              # Metode 4: download dari Maven Central
              if [ ! -s "$WRAPPER_DIR/gradle-wrapper.jar" ]; then
                curl -fsSL \
                  "https://repo1.maven.org/maven2/org/gradle/wrapper/8.4/wrapper-8.4.jar" \
                  -o "$WRAPPER_DIR/gradle-wrapper.jar" 2>/dev/null || true
              fi
            fi
          fi

          # Verifikasi
          if [ ! -s "$WRAPPER_DIR/gradle-wrapper.jar" ]; then
            echo "[ERROR] Semua metode gagal!"
            exit 1
          fi
          echo "[OK] gradle-wrapper.jar siap: $(ls -lh $WRAPPER_DIR/gradle-wrapper.jar)"

      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: ${{ github.workspace }}/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 | \
            xargs -I{} cp {} output/SyncXxX.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/SyncXxX.apk
          retention-days: 30
