name: Build Genetic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify genetic source
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== genetic/ ==="
          ls genetic/ 2>/dev/null || echo "(tidak ada folder genetic/)"

          # ── Deteksi lokasi android/ secara otomatis ──
          # Kemungkinan 1: genetic/android/ (bot push flat)
          # Kemungkinan 2: genetic/base_phsing_lunex/android/ (zip wrapper)
          # Kemungkinan 3: android/ langsung di root

          ANDROID_DIR=""

          if [ -d "genetic/android" ]; then
            echo "✅ Ditemukan: genetic/android/"
            ANDROID_DIR="genetic/android"

          elif [ -d "genetic" ]; then
            # Cari subfolder yang punya android/ di dalamnya
            SUBFOLDER=$(find genetic -maxdepth 2 -type d -name "android" | head -1)
            if [ -n "$SUBFOLDER" ]; then
              ANDROID_DIR=$(dirname "$SUBFOLDER")
              echo "✅ Ditemukan di: $ANDROID_DIR"
            else
              echo "ERROR: genetic/android/ tidak ditemukan!"
              echo "Isi genetic/:"
              ls -la genetic/ 2>/dev/null
              exit 1
            fi

          elif [ -d "android" ]; then
            echo "✅ Ditemukan: android/ di root"
            ANDROID_DIR="."

          else
            echo "ERROR: Tidak ada folder android/ ditemukan!"
            echo "Isi root:"
            ls -la
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV
          echo "✅ ANDROID_DIR = $ANDROID_DIR"

          # Deteksi lokasi generate_icons.py
          ICONS_PY=""
          if [ -f "$ANDROID_DIR/../generate_icons.py" ]; then
            ICONS_PY="$ANDROID_DIR/../generate_icons.py"
          elif [ -f "genetic/generate_icons.py" ]; then
            ICONS_PY="genetic/generate_icons.py"
          elif [ -f "generate_icons.py" ]; then
            ICONS_PY="generate_icons.py"
          fi
          echo "ICONS_PY=$ICONS_PY" >> $GITHUB_ENV
          echo "✅ ICONS_PY = $ICONS_PY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: |
          if [ -n "$ICONS_PY" ] && [ -f "$ICONS_PY" ]; then
            echo "✅ Menjalankan $ICONS_PY"
            python3 "$ICONS_PY"
          else
            echo "⚠️ generate_icons.py tidak ditemukan — skip"
          fi

      - name: Fix local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$ANDROID_DIR/android/local.properties"
          echo "✅ local.properties dibuat di $ANDROID_DIR/android/"

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p "$ANDROID_DIR/android/gradle/wrapper"
          curl -L -o "$ANDROID_DIR/android/gradle/wrapper/gradle-wrapper.jar" \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$ANDROID_DIR/android/gradlew"
          echo "✅ Gradle wrapper OK"

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Release APK
        run: |
          cd "$ANDROID_DIR/android"
          echo "✅ Build di: $(pwd)"
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Rename & collect APK
        run: |
          mkdir -p output
          APK=$(find "$ANDROID_DIR/android/app/build/outputs/apk/release/" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find "$ANDROID_DIR/android/app/build/" -name "*.apk" 2>/dev/null
            exit 1
          fi
          cp "$APK" output/genetic.apk
          echo "✅ APK: $(du -sh output/genetic.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genetic-APK
          path: output/genetic.apk
          retention-days: 7
